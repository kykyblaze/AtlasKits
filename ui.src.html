<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AtlasKits</title>
  <style>/* CSS_INJECT */</style>
</head>

<body>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" data-tab="flags">🏳 Flags</div>
    <div class="tab" data-tab="maps">🗺 Maps</div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
        <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5" />
        <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      <input class="search-input" id="searchInput" type="text" placeholder="Search by country name or ISO code…"
        autocomplete="off" />
    </div>
    <div class="filter-bar visible" id="filterBar">
      <button class="filter-btn active" data-shape="rect">
        <span class="filter-shape rect"></span> Rectangle
      </button>
      <button class="filter-btn" data-shape="sq">
        <span class="filter-shape sq"></span> Square
      </button>
      <button class="filter-btn" data-shape="circ">
        <span class="filter-shape circ"></span> Circle
      </button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content" id="contentArea"></div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="count-badge" id="countBadge">No items selected</div>
    <button class="btn-add" id="btnAdd" disabled>Add</button>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- Injected by build-ui.js: window.ASSETS = { "flags/countries/rectangle/afghanistan": "<base64>", ... } -->
  <script>/* ASSETS_INJECT */</script>

  <!-- Injected by build-ui.js: country/org/continent data arrays -->
  <script>/* DATA_INJECT */</script>

  <!-- Injected by build-ui.js: UI logic from src/ui.js -->
  <script>/* JS_INJECT */</script>

</body>

</html>
