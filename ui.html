<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AtlasKits</title>
<style>
  :root {
    --bg: #0f0f11;
    --surface: #1a1a1f;
    --surface2: #242429;
    --border: #2e2e38;
    --accent: #5b6af0;
    --accent-dim: rgba(91,106,240,0.15);
    --text: #e8e8f0;
    --muted: #7a7a92;
    --success: #34d399;
    --font: 'Inter', system-ui, sans-serif;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 10px 4px;
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
    letter-spacing: .3px;
    user-select: none;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab:hover:not(.active) { color: var(--text); }

  /* ── TOOLBAR ── */
  .toolbar {
    padding: 8px 10px 0;
    background: var(--bg);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .search-wrap {
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 11px;
    padding: 6px 8px 6px 28px;
    outline: none;
    transition: border-color .15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  /* ── FILTER (flags only) ── */
  .filter-bar {
    display: none;
    gap: 4px;
  }
  .filter-bar.visible { display: flex; }
  .filter-btn {
    flex: 1;
    padding: 5px 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 10px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    letter-spacing: .2px;
  }
  .filter-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  .filter-btn:hover:not(.active) { border-color: var(--muted); color: var(--text); }

  .filter-shape {
    display: inline-block;
    background: currentColor;
    flex-shrink: 0;
  }
  .filter-shape.rect  { width: 18px; height: 12px; border-radius: 1px; }
  .filter-shape.sq    { width: 12px; height: 12px; border-radius: 1px; }
  .filter-shape.circ  { width: 12px; height: 12px; border-radius: 50%; }

  /* ── CONTENT AREA ── */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .content::-webkit-scrollbar { width: 4px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Section label */
  .section-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .8px;
    padding: 4px 0 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }

  .item {
    position: relative;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 6px 6px;
    cursor: pointer;
    transition: border-color .12s, background .12s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    min-width: 0;
  }
  .item:hover { border-color: #44445a; background: var(--surface2); }
  .item.selected {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .item-img-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Flag shapes */
  .item-img-wrap img,
  .item-img-wrap svg {
    display: block;
    max-width: 100%;
  }

  .item-img-wrap.rect  img { width: 36px; height: 24px; object-fit: cover; }
  .item-img-wrap.sq    img { width: 24px; height: 24px; object-fit: cover; }
  .item-img-wrap.circ  img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
  .item-img-wrap.coat  img { width: 28px; height: 32px; object-fit: contain; }
  .item-img-wrap.map   img { width: 34px; height: 26px; object-fit: contain; }

  /* Fallback placeholder */
  .img-placeholder {
    background: var(--surface2);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 9px;
  }
  .img-placeholder.rect  { width: 36px; height: 24px; }
  .img-placeholder.sq    { width: 24px; height: 24px; }
  .img-placeholder.circ  { width: 24px; height: 24px; border-radius: 50%; }
  .img-placeholder.coat  { width: 28px; height: 32px; }
  .img-placeholder.map   { width: 34px; height: 26px; }

  .item-name {
    font-size: 9px;
    color: var(--muted);
    text-align: center;
    line-height: 1.3;
    max-width: 100%;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    width: 100%;
  }
  .item.selected .item-name { color: var(--text); }

  /* Checkbox overlay */
  .item-check {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .12s;
  }
  .item.selected .item-check {
    background: var(--accent);
    border-color: var(--accent);
  }
  .item-check svg { opacity: 0; transition: opacity .12s; }
  .item.selected .item-check svg { opacity: 1; }

  /* ── EMPTY STATE ── */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    font-size: 11px;
    padding: 40px 20px;
    text-align: center;
  }
  .empty svg { opacity: .4; }

  /* ── FOOTER / ACTION BAR ── */
  .footer {
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .count-badge {
    font-size: 10px;
    color: var(--muted);
    flex: 1;
  }
  .count-badge span { color: var(--text); font-weight: 600; }

  .btn-add {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    padding: 7px 16px;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    letter-spacing: .3px;
    min-width: 60px;
  }
  .btn-add:disabled {
    background: var(--surface2);
    color: var(--muted);
    cursor: default;
  }
  .btn-add:not(:disabled):hover { opacity: .88; }
  .btn-add:not(:disabled):active { transform: scale(.97); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 54px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--success);
    color: #0f0f11;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    white-space: nowrap;
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Loading spinner */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    color: var(--muted);
    font-size: 11px;
    gap: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
</style>
</head>

  // section: 'Countries' | 'Unions'
  const folder = shape === 'sq' ? 'Square' : shape === 'circ' ? 'Circle' : 'Rectangle';
  return `${BASE_URL}/test/assets/flags/${section}/${folder}/${name}.svg`;
}
function coatUrl(name) {
  return `${BASE_URL}/test/assets/coats/Countries/${name} coat of arms.svg`;
}
function continentUrl(name) {

}

];

// Map countries — URLs built at render time via mapUrl()
const MAP_COUNTRIES = COUNTRIES.map(c => ({ name: c.name, iso: c.iso, type: 'country' }));

// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
const MAX_SELECT = 10;

let state = {
  tab: 'flags',        // 'flags' | 'coats' | 'maps'
  shape: 'rect',       // 'rect' | 'sq' | 'circ'
  query: '',
  selected: new Set(),  // Set of item keys like "flags:US" or "coats:US"
};

// ─────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────
function itemKey(tab, item) {
  const id = item.iso || item.name;
  const typePrefix = item.type ? `${item.type}:` : '';
  return `${tab}:${typePrefix}${id}`;
}

function filterItems(items, query, hasIso = true) {
  if (!query) return items;
  const q = query.toLowerCase().trim();
  return items.filter(i => {
    const nameMatch = i.name.toLowerCase().includes(q);
    const isoMatch = hasIso && i.iso && i.iso.toLowerCase().includes(q);
    return nameMatch || isoMatch;
  });
}

function imgClass() {
  if (state.tab === 'flags') return state.shape;
  if (state.tab === 'coats') return 'coat';
  return 'map';
}

function getItemUrl(item) {
  if (state.tab === 'flags') {
    const section = item.type === 'union' ? 'Unions' : 'Countries';
    return flagUrl(item.name, state.shape, section);
  }
  if (state.tab === 'coats') return coatUrl(item.name);
  if (state.tab === 'maps') {
    return item.type === 'continent' ? continentUrl(item.name) : mapUrl(item.name);
  }
  return '';
}

function renderImg(item) {
  const cls = imgClass();
  const url = getItemUrl(item);
  return `<div class="item-img-wrap ${cls}">
    <img src="${url}" alt="${item.name}" loading="lazy" 
         onerror="this.parentNode.innerHTML='<div class=\\'img-placeholder ${cls}\\'>${item.iso || '?'}</div>'"/>
  </div>`;
}

function renderItem(item) {
  const key = itemKey(state.tab, item);
  const sel = state.selected.has(key) ? 'selected' : '';
  return `<div class="item ${sel}" data-key="${key}" data-file="${item.file}" data-name="${item.name}">
    ${renderImg(item)}
    <div class="item-name">${item.name}</div>
    <div class="item-check">
      <svg width="8" height="6" viewBox="0 0 8 6" fill="none">
        <path d="M1 3L3 5L7 1" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>`;
}

function renderSection(label, items) {
  if (!items.length) return '';
  return `
    <div class="section-label">${label} <span style="color:var(--accent);font-weight:700">${items.length}</span></div>
    <div class="grid">${items.map(renderItem).join('')}</div>
  `;
}

// ─────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────
function render() {
  const q = state.query;
  const content = document.getElementById('contentArea');

  // Filter bar visibility
  document.getElementById('filterBar').classList.toggle('visible', state.tab === 'flags');

  let html = '';

  if (state.tab === 'flags') {
    const unions = filterItems(UNIONS, q);
    const countries = filterItems(COUNTRIES.map(c => ({...c, type: 'country'})), q);
    if (!unions.length && !countries.length) {
      html = emptyHTML();
    } else {
      html += renderSection('Unions', unions);
      html += renderSection('Countries', countries);
    }
  } else if (state.tab === 'coats') {
    const items = filterItems(COATS, q);
    html = items.length ? renderSection('Countries', items) : emptyHTML();
  } else {
    const continents = filterItems(CONTINENTS, q, false);
    const countries = filterItems(MAP_COUNTRIES, q);
    if (!continents.length && !countries.length) {
      html = emptyHTML();
    } else {
      html += renderSection('Continents', continents);
      html += renderSection('Countries', countries);
    }
  }

  content.innerHTML = html;
  updateFooter();
  bindItemClicks();
}

function emptyHTML() {
  return `<div class="empty">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
      <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.5"/>
      <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    No results found
  </div>`;
}

function updateFooter() {
  const count = state.selected.size;
  const badge = document.getElementById('countBadge');
  const btn = document.getElementById('btnAdd');
  if (count === 0) {
    badge.innerHTML = 'No items selected';
    btn.textContent = 'Add';
    btn.disabled = true;
  } else {
    badge.innerHTML = `<span>${count}</span> item${count !== 1 ? 's' : ''} selected`;
    btn.textContent = `Add ${count}`;
    btn.disabled = false;
  }
}

// ─────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────
function bindItemClicks() {
  document.querySelectorAll('.item').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.key;
      if (state.selected.has(key)) {
        state.selected.delete(key);
        el.classList.remove('selected');
      } else {
        if (state.selected.size >= MAX_SELECT) {
          showToast(`Max ${MAX_SELECT} items at a time`);
          return;
        }
        state.selected.add(key);
        el.classList.add('selected');
      }
      updateFooter();
    });
  });
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const t = tab.dataset.tab;
    if (t === state.tab) return;
    state.tab = t;
    state.query = '';
    state.selected.clear();
    document.getElementById('searchInput').value = '';
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    tab.classList.add('active');
    render();
  });
});

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  state.query = e.target.value;
  render();
});

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.shape = btn.dataset.shape;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

// Add button
document.getElementById('btnAdd').addEventListener('click', () => {
  if (state.selected.size === 0) return;

  // Build payload: map selected keys to file paths + metadata
  const items = [];
  state.selected.forEach(key => {
    // Find item by key
    const parts_top = key.split(':');
    const tab = parts_top[0];
    const id = parts_top.slice(1).join(':'); // Support IDs with colons
    let found = null;

    const parts = id.split(':');
    let type = null, actualId = id;
    if (parts.length > 1) {
      [type, actualId] = parts;
    }

    if (tab === 'flags') {
      const pool = type === 'union' ? UNIONS : COUNTRIES;
      found = pool.find(i => (i.iso === actualId || i.name === actualId));
      if (found) found = { ...found, type: type || 'country' };
    } else if (tab === 'coats') {
      found = COATS.find(i => i.iso === actualId || i.name === actualId);
    } else {
      // Maps: continents or countries
      const pool = type === 'continent' ? CONTINENTS : MAP_COUNTRIES;
      found = pool.find(i => (i.iso === actualId || i.name === actualId || i.slug === actualId));
    }

    if (found) {
      // Build the CDN URL for this item
      let url = '';
      if (tab === 'flags') {
        const section = found.type === 'union' ? 'Unions' : 'Countries';
        url = flagUrl(found.name, state.shape, section);
      } else if (tab === 'coats') {
        url = coatUrl(found.name);
      } else {
        url = found.type === 'continent' ? continentUrl(found.name) : mapUrl(found.name);
      }
      items.push({
        name: found.name,
        iso: found.iso || '',
        url,
        tab,
        shape: tab === 'flags' ? state.shape : null,
      });
    }
  });

  parent.postMessage({ pluginMessage: { type: 'add-assets', items } }, '*');
  state.selected.clear();
  showToast(`Added ${items.length} item${items.length !== 1 ? 's' : ''}`);
  render();
});

// Toast
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// Messages from plugin
window.addEventListener('message', e => {
  const msg = e.data.pluginMessage;
  if (!msg) return;
  if (msg.type === 'add-success') showToast(`Added ${msg.count} item${msg.count !== 1 ? 's' : ''} ✓`);
  if (msg.type === 'add-error') showToast('Error: ' + msg.message);
});

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
render();
</script>
</body>
</html>
